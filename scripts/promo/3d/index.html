<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Cormorant; src: url(fonts/cormorant-garamond-latin-500-normal.woff); font-weight: 500; }
@font-face { font-family: Cormorant; src: url(fonts/cormorant-garamond-latin-500-italic.woff); font-weight: 500; font-style: italic; }
@font-face { font-family: Jost; src: url(fonts/jost-latin-400-normal.woff); font-weight: 400; }
@font-face { font-family: Jost; src: url(fonts/jost-latin-500-normal.woff); font-weight: 500; }
html, body { margin: 0; background: #fbfaf7; overflow: hidden; }
canvas { position: absolute; inset: 0; }
</style>
<script type="importmap">{ "imports": { "three": "./node_modules/three/build/three.module.js", "rapier": "./node_modules/@dimforge/rapier3d-compat/dist/rapier.mjs" } }</script>
</head><body>
<canvas id="c"></canvas>
<script type="module">
/* Sottovoce songs promo. Composers' faces as coins fired onto a table from every side, shoving to reach the middle;
   blasted up at the lens; the headline slams in a word at a time; a green card cuts through what the app does; a
   second volley crashes in around the name. Rendered one frame at a time by render.cjs. */
import * as THREE from 'three';
import RAPIER from 'rapier';

const Q = new URLSearchParams(location.search);
const W = +Q.get('w') || 1080, H = +Q.get('h') || 1920, FPS = 30;
const PORT = W < H, U = Math.min(W, H) / 1080;
const PAPER = '#fbfaf7', INK = '#1a1814', GO = '#17402c', MINT = '#9fd6b2';
let seed = 11; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const clamp = (x) => Math.max(0, Math.min(1, x));
const ease = (x) => 1 - (1 - clamp(x)) ** 3;
const back = (x) => { x = clamp(x); const c = 2.2; return 1 + (c + 1) * (x - 1) ** 3 + c * (x - 1) ** 2; };

// timeline (seconds)
const T_RAIN1 = [0.0, 1.5], T_BURST = 2.9;
const T_W = [3.25, 3.75, 4.25];            // the headline's three beats
const T_CARD = 5.6, FEAT_D = 0.78;        // the green card, and how long each line holds
const FEATS = [['Every word', 'translated.'], ['IPA for', 'every word.'], ['Every word', 'spoken aloud.'], ['A piano that', 'slows down.'], ['And loops', 'the hard bits.'], ['Score and texts', 'as PDF.']];
const T_CARD_OUT = T_CARD + 0.3 + FEATS.length * FEAT_D;
const T_RAIN2 = T_CARD_OUT - 0.55, T_LOGO = T_CARD_OUT + 0.55, T_END = T_LOGO + 2.6;
window.duration = T_END;

// ---------- 2D layers ----------
const OUTC = document.createElement('canvas'); OUTC.width = W; OUTC.height = H; const X = OUTC.getContext('2d');
await document.fonts.load('500 100px Cormorant'); await document.fonts.load('italic 500 100px Cormorant'); await document.fonts.load('500 100px Jost'); await document.fonts.load('400 100px Jost');
const fitSize = (s, f, maxW, maxPx) => { X.font = f(100); return Math.min(maxPx, 100 * maxW / X.measureText(s).width); };
const HEADL = PORT ? [['Hundreds', 0], ['of art songs', 0], ['and Lieder.', 1]] : [['Hundreds of', 0], ['art songs', 0], ['and Lieder.', 1]];
const headF = (it) => (px) => `500 ${px}px Jost`;
const headPx = Math.min(...HEADL.map(([s, it]) => fitSize(s, headF(it), W * (PORT ? 0.66 : 0.44), 130 * U)));
function drawHead(t) {
  const lh = headPx * 1.12, y0 = H / 2 - lh * 1.5 + headPx * 0.85;
  const out = ease((t - T_CARD) / 0.25);
  HEADL.forEach(([s, it], n) => {
    const p = (t - T_W[n]) / 0.32;
    if (p <= 0) return;
    const k = back(p), sc = 1 + (1 - k) * 0.9;
    X.save(); X.translate(W / 2, y0 + n * lh); X.scale(sc, sc);
    X.globalAlpha = clamp(p * 3) * (1 - out);
    X.font = headF(it)(headPx); X.textAlign = 'center'; X.fillStyle = it ? GO : INK; X.fillText(s, 0, 0);
    X.restore();
  });
}
const featPx = Math.min(...FEATS.flat().map((s) => fitSize(s, (px) => `500 ${px}px Jost`, W * (PORT ? 0.6 : 0.4), 92 * U)));
function drawCard(t) {
  // in from the bottom, out through the top
  const pin = ease((t - T_CARD) / 0.3), pout = ease((t - T_CARD_OUT) / 0.35);
  if (pin <= 0 || pout >= 1) return;
  const top = H * (1 - pin) - H * pout * 0, bot = H - H * pout;
  X.fillStyle = GO; X.fillRect(0, Math.max(0, top), W, Math.max(0, bot - top));
  X.save(); X.beginPath(); X.rect(0, top, W, bot - top); X.clip();
  FEATS.forEach(([a, b], n) => {
    const t0 = T_CARD + 0.3 + n * FEAT_D, p = (t - t0) / 0.28, q = (t - t0 - FEAT_D + 0.16) / 0.16;
    if (p <= 0 || q >= 1) return;
    const k = back(p), y = H / 2 + (1 - k) * featPx * 1.4 - ease(q) * featPx * 1.4;
    X.globalAlpha = clamp(p * 2.5) * (1 - clamp(q));
    X.textAlign = 'center';
    X.font = `500 ${featPx * 0.4}px Jost`; X.fillStyle = MINT; X.fillText(String(n + 1).padStart(2, '0'), W / 2, y - featPx * 1.3);
    X.font = `500 ${featPx}px Jost`; X.fillStyle = PAPER; X.fillText(a, W / 2, y - featPx * 0.05);
    X.font = `500 ${featPx}px Jost`; X.fillStyle = MINT; X.fillText(b, W / 2, y + featPx * 1.15);
  });
  X.restore(); X.globalAlpha = 1;
}
const logoPx = fitSize('Sottovoce', (px) => `italic 500 ${px}px Cormorant`, W * (PORT ? 0.56 : 0.3), 200 * U);
function drawLogo(t) {
  const p = (t - T_LOGO) / 0.38;
  if (p <= 0) return;
  const k = back(p), sc = 1 + (1 - k) * 1.2;
  X.save(); X.translate(W / 2, H / 2 + logoPx * 0.2); X.scale(sc, sc); X.globalAlpha = clamp(p * 3);
  X.textAlign = 'center'; X.font = `italic 500 ${logoPx}px Cormorant`; X.fillStyle = INK; X.fillText('Sottovoce', 0, 0);
  X.restore();
  const a = ease((t - T_LOGO - 0.35) / 0.4);
  X.globalAlpha = a; X.textAlign = 'center'; X.font = `500 ${logoPx * 0.22}px Jost`; X.fillStyle = '#5f5a52';
  X.fillText('Opera · Songs · Choral', W / 2, H / 2 + logoPx * 0.62 + 20 * U * (1 - a)); X.globalAlpha = 1;
}

// ---------- 3D ----------
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H, false);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.NoToneMapping;
const scene = new THREE.Scene();
const VW = W / 100, VH = H / 100;
const camera = new THREE.PerspectiveCamera(34, W / H, 1, 200);
const table = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.ShadowMaterial({ color: 0x2a1e12, opacity: 0.27 }));
table.rotation.x = -Math.PI / 2; table.receiveShadow = true; scene.add(table);
scene.add(new THREE.HemisphereLight(0xffffff, 0xe6ddd0, 1.6));
const sun = new THREE.DirectionalLight(0xfff4e6, 2.0);
sun.position.set(-12, 34, -16); sun.castShadow = true;
const sc = sun.shadow.camera; const SPAN = Math.max(VW, VH) * 1.2; sc.left = -SPAN; sc.right = SPAN; sc.top = SPAN; sc.bottom = -SPAN; sc.near = 1; sc.far = 90;
sun.shadow.mapSize.set(2048, 2048); sun.shadow.radius = 7; sun.shadow.bias = -0.0004;
scene.add(sun);

// the camera: tilted over the table, swinging round and pushing in, then pulling back for the blast
const camDist = (VH / 2) / Math.tan((34 / 2) * Math.PI / 180);
const shake = { amp: 0, t: 0 };
function poseCamera(t) {
  let yaw, elev, dist;
  if (t < T_BURST) { const p = ease(t / T_BURST); yaw = -14 + 18 * p; elev = 58 + 8 * p; dist = camDist * (1.25 - 0.22 * p); }
  else if (t < T_CARD_OUT) { const p = ease((t - T_BURST) / 1.2); yaw = 4 + 6 * p; elev = 66 + 6 * p; dist = camDist * (1.03 + 0.25 * p); }
  else { const p = ease((t - T_CARD_OUT) / 2.5); yaw = -4 + 4 * p; elev = 72 + 6 * p; dist = camDist * (1.12 - 0.06 * p); }
  const y = yaw * Math.PI / 180, e = elev * Math.PI / 180;
  camera.position.set(Math.sin(y) * Math.cos(e) * dist, Math.sin(e) * dist, Math.cos(y) * Math.cos(e) * dist);
  const s = shake.amp * Math.exp(-(t - shake.t) * 7);
  camera.position.x += (rnd() - .5) * s; camera.position.z += (rnd() - .5) * s;
  camera.lookAt((rnd() - .5) * s * 0.3, 0, (rnd() - .5) * s * 0.3);
}

// coins: the face edge to edge, the edge in the face's own colour, darker
const R = 1.25, TH = 0.2, BEV = 0.07;
const prof = [new THREE.Vector2(0, 0)];
for (let k = 0; k <= 8; k++) { const a = -Math.PI / 2 + (k / 8) * Math.PI / 2; prof.push(new THREE.Vector2(R - BEV + BEV * Math.cos(a), BEV + BEV * Math.sin(a))); }
for (let k = 0; k <= 8; k++) { const a = (k / 8) * Math.PI / 2; prof.push(new THREE.Vector2(R - BEV + BEV * Math.cos(a), TH - BEV + BEV * Math.sin(a))); }
prof.push(new THREE.Vector2(0, TH));
const rimGeo = new THREE.LatheGeometry(prof, 72);
const FR = R - BEV * 0.55;
const faceGeo = new THREE.CircleGeometry(FR, 72); faceGeo.rotateX(-Math.PI / 2); faceGeo.translate(0, TH + 0.003, 0);
const backGeo = new THREE.CircleGeometry(FR, 72); backGeo.rotateX(Math.PI / 2); backGeo.translate(0, -0.003, 0);
const IDS = JSON.parse(Q.get('ids'));
const mats = {};
await Promise.all(IDS.map((i) => new Promise((ok) => { const im = new Image(); im.onload = () => {
  const cv = document.createElement('canvas'); cv.width = cv.height = 8; const cx = cv.getContext('2d'); cx.drawImage(im, 0, 0, 8, 8);
  const d = cx.getImageData(0, 0, 1, 1).data;
  const tex = new THREE.Texture(im); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8; tex.needsUpdate = true;
  const edge = new THREE.Color(`rgb(${d[0]},${d[1]},${d[2]})`).multiplyScalar(0.72);
  mats[i] = { face: new THREE.MeshStandardMaterial({ map: tex, roughness: 0.48 }), rim: new THREE.MeshStandardMaterial({ color: edge, roughness: 0.5 }) };
  ok(); }; im.src = `faces/composer-${i}-face.webp`; })));

await RAPIER.init();
const G = 70;
const world = new RAPIER.World({ x: 0, y: -G, z: 0 });
world.timestep = 1 / (FPS * 4);
const ground = world.createCollider(RAPIER.ColliderDesc.cuboid(300, 0.5, 300).setTranslation(0, -0.5, 0).setFriction(0.4).setRestitution(0.2));

// what the camera sees of the table, in its pose at a given moment: a coin is "in frame" if it projects inside
function inFrame(t, x, z, m = 1.08) { poseCamera(t); camera.updateMatrixWorld(); const v = new THREE.Vector3(x, 0, z).project(camera); return Math.abs(v.x) < m && Math.abs(v.y) < m; }
function footprintArea(t) { let n = 0; for (let x = -40; x < 40; x += 0.5) for (let z = -40; z < 40; z += 0.5) if (inFrame(t, x, z, 1.0)) n++; return n * 0.25; }

const coins = [];
let idn = 0;
function makeCoin(sx, sz, vx, vz, t0, wave) {
  const id = IDS[idn++ % IDS.length];
  const g = new THREE.Group();
  const rim = new THREE.Mesh(rimGeo, mats[id].rim); rim.castShadow = true; rim.receiveShadow = true;
  const f = new THREE.Mesh(faceGeo, mats[id].face); f.receiveShadow = true;
  const b = new THREE.Mesh(backGeo, mats[id].face);
  g.add(rim, f, b); g.visible = false; scene.add(g);
  coins.push({ g, sx, sz, vx, vz, t0, wave, body: null, spin: (rnd() - .5) * 2.5 });
}
// volley 1: fired hard from every side at the middle; they keep being pulled there, and shove for room
const area1 = footprintArea(T_BURST - 0.3);
const N1 = Math.round(area1 / (2 * Math.sqrt(3) * R * R) * 1.25);
for (let n = 0; n < N1; n++) {
  const a = rnd() * Math.PI * 2, out = 26 + rnd() * 6;
  const sx = Math.cos(a) * out, sz = Math.sin(a) * out * (PORT ? 1.5 : 1);
  const aim = Math.atan2(-sz, -sx) + (rnd() - .5) * 0.35, v = 34 + rnd() * 14;
  makeCoin(sx, sz, Math.cos(aim) * v, Math.sin(aim) * v, T_RAIN1[0] + (n / N1) * (T_RAIN1[1] - T_RAIN1[0]) + rnd() * 0.12, 1);
}
// volley 2: crashes in around the name, leaving the middle clear; each aimed to come to rest at its own place
const spots2 = [];
{ const sp = 2 * R * 1.06, rh = sp * Math.sqrt(3) / 2, tE = T_END - 0.5;
  const ex = PORT ? VW * 0.9 : VW * 0.34, ez = PORT ? VH * 0.15 : VH * 0.3;
  for (let r = -16; r <= 16; r++) for (let c = -16; c <= 16; c++) {
    const x = c * sp + (r & 1 ? sp / 2 : 0) + (rnd() - .5) * 0.3, z = r * rh + (rnd() - .5) * 0.3;
    if ((x / ex) ** 2 + (z / ez) ** 2 < 1) continue;
    if (inFrame(tE, x, z, 1.12)) spots2.push({ x, z });
  } }
spots2.sort((a, b) => Math.hypot(a.x, a.z) - Math.hypot(b.x, b.z));
const decel = 0.4 * G;
spots2.forEach((s, n) => {
  const d0 = Math.hypot(s.x, s.z) || 1, dx = s.x / d0, dz = s.z / d0;
  const sx = s.x + dx * 14, sz = s.z + dz * 14;
  const v = Math.sqrt(2 * decel * 14) * 1.0;
  makeCoin(sx, sz, -dx * v, -dz * v, T_RAIN2 + (n / spots2.length) * 0.55 + rnd() * 0.08, 2);
});

function launch(c) {
  const b = world.createRigidBody(RAPIER.RigidBodyDesc.dynamic().setTranslation(c.sx, TH / 2 + 0.003, c.sz).setLinvel(c.vx, 0, c.vz)
    .setAngvel({ x: 0, y: c.spin, z: 0 }).setCcdEnabled(true).setAngularDamping(0.8).setLinearDamping(c.wave === 1 ? 0.6 : 0.05));
  world.createCollider(RAPIER.ColliderDesc.roundCylinder(TH / 2 - BEV, R - BEV, BEV).setFriction(0.4).setRestitution(0.3).setDensity(2), b);
  c.body = b; c.g.visible = true;
}
function pull() {
  // every coin of the first volley wants the middle; small shoves keep them fighting for it
  for (const c of coins) {
    if (c.wave !== 1 || !c.body) continue;
    const p = c.body.translation(), d = Math.hypot(p.x, p.z) || 1, m = c.body.mass();
    const f = Math.min(1, d / 3) * 85 * m / (FPS * 4);
    c.body.applyImpulse({ x: -p.x / d * f + (rnd() - .5) * 2.2 * m / FPS, y: 0, z: -p.z / d * f + (rnd() - .5) * 2.2 * m / FPS }, true);
  }
}
function burst() {
  ground.setFriction(0.15);
  for (const c of coins) {
    if (c.wave !== 1 || !c.body) continue;
    const p = c.body.translation(), d = Math.hypot(p.x, p.z) || 1, m = c.body.mass();
    c.body.setLinearDamping(0.02);
    const up = (26 + 22 * Math.max(0, 1 - d / 8) + rnd() * 8) * m, outv = (12 + d * 2.2 + rnd() * 6) * m;
    c.body.applyImpulse({ x: p.x / d * outv, y: up, z: p.z / d * outv }, true);
    c.body.applyTorqueImpulse({ x: (rnd() - .5) * 6 * m, y: (rnd() - .5) * 2 * m, z: (rnd() - .5) * 6 * m }, true);
  }
  shake.amp = 1.6; shake.t = T_BURST;
}
function clearWave1() { ground.setFriction(0.4); for (const c of coins) if (c.wave === 1 && c.body) { world.removeRigidBody(c.body); c.body = null; c.g.visible = false; c.gone = true; } }

let frame = 0, burstDone = false, cleared = false, hit2 = false;
window.renderFrame = () => {
  const t = frame / FPS;
  for (let s = 0; s < 4; s++) {
    const ts = t + s / (FPS * 4);
    for (const c of coins) if (!c.body && !c.gone && ts >= c.t0) launch(c);
    if (!burstDone && ts >= T_BURST) { burstDone = true; burst(); }
    if (!burstDone) pull();
    if (!cleared && ts >= T_CARD + 0.35) { cleared = true; clearWave1(); }
    if (!hit2 && ts >= T_RAIN2 + 0.45) { hit2 = true; shake.amp = 0.5; shake.t = ts; }
    world.step();
  }
  for (const c of coins) if (c.body) { const p = c.body.translation(), q = c.body.rotation(); c.g.position.set(p.x, p.y - TH / 2, p.z); c.g.quaternion.set(q.x, q.y, q.z, q.w); }
  poseCamera(t);
  renderer.render(scene, camera);
  X.globalAlpha = 1; X.fillStyle = PAPER; X.fillRect(0, 0, W, H);
  drawHead(t);
  X.drawImage(renderer.domElement, 0, 0);
  drawCard(t);
  drawLogo(t);
  frame++;
  return OUTC.toDataURL('image/jpeg', 0.93).slice(23);
};
window.ready = true;
</script>
</body></html>
